# ===================================================
# Render Deployment Profile
# This profile is activated on Render via SPRING_PROFILES_ACTIVE=render
# ===================================================

# MongoDB URI (Render sets MONGODB_URI or DATABASE_URL or SPRING_DATA_MONGODB_URI)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:${DATABASE_URL}}}

# Server port (Render sets PORT env variable)
server.port=${PORT:8080}

# Thymeleaf
spring.thymeleaf.cache=true

# Session
server.servlet.session.timeout=45m

# App settings
fic.quiz.duration-minutes=30
